name: pixel RSI
# CP123 D15: the nightly deterministic DSIP cron is ARMED (un-commented `schedule:` below).
# It runs the $0 tokenless loop `node workflows/rsi.workflow.js --check` (A24 — re-verify the
# tool-matrix versions + run the L1 evals + write a BRAIN-DRIFT proposal on drift). The job is
# guarded by an engine-presence check so it stays green until A24 lands, then runs the real loop.
# The Claude half (LLM brain-refresh) additionally needs CLAUDE_CODE_OAUTH_TOKEN (checklist, D8).
on:
  workflow_dispatch:
  schedule:
    # Nightly at 07:17 UTC (off the top-of-hour to avoid GitHub's cron congestion).
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  rsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.9'
      - name: Deterministic DSIP loop ($0, tokenless)
        run: |
          if [ ! -f workflows/rsi.workflow.js ]; then
            echo "RSI engine (workflows/rsi.workflow.js) not built yet (A24) — exiting green."; exit 0
          fi
          node workflows/rsi.workflow.js --check
