name: pixel RSI
# CP123 D15: the nightly deterministic DSIP cron is ARMED (un-commented `schedule:` below).
# It runs the $0 tokenless loop `node workflows/rsi.workflow.js --check` (A24 — re-verify the
# tool-matrix versions + run the L1 evals + write a BRAIN-DRIFT proposal on drift). The job is
# guarded by an engine-presence check so it stays green until A24 lands, then runs the real loop.
# The Claude half (LLM brain-refresh) additionally needs CLAUDE_CODE_OAUTH_TOKEN (checklist, D8).
on:
  workflow_dispatch:
  schedule:
    # Nightly at 07:17 UTC (off the top-of-hour to avoid GitHub's cron congestion).
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  rsi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.9'
      - name: Deterministic DSIP loop ($0, tokenless)
        run: |
          if [ ! -f workflows/rsi.workflow.js ]; then
            echo "RSI engine (workflows/rsi.workflow.js) not built yet (A24) — exiting green."; exit 0
          fi
          node workflows/rsi.workflow.js --check
      - name: Pick up a fresh proposal (only when the loop rewrote BRAIN-DRIFT.md)
        if: always()
        run: |
          if [ -f BRAIN-DRIFT.md ] && ! git diff --quiet -- BRAIN-DRIFT.md; then
            cp BRAIN-DRIFT.md brain-drift-proposal.md
            echo "new proposal written for review"
          else
            echo "no new proposal tonight"
          fi
      - name: Keep the proposal for review (never merged by the loop)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-drift-proposal
          path: brain-drift-proposal.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Open or update the proposal issue for a person to review
        if: always() && hashFiles('brain-drift-proposal.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s brain-drift-proposal.md ] || { echo "The proposal file is empty, so no issue."; exit 0; }
          gh label create proposal --color 2f5d8a --description "A change the self-improvement loop proposes for a person to review" --force
          {
            echo "Written by the scheduled self-improvement loop on $(date -u '+%Y-%m-%d %H:%M UTC'). It proposes; a person decides. The loop never merges."
            echo
            cat brain-drift-proposal.md
          } > "$RUNNER_TEMP/proposal-issue.md"
          number=$(gh issue list --label proposal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/proposal-issue.md"
          else
            gh issue create --title "Pixel: proposal from the self-improvement loop" --label proposal --body-file "$RUNNER_TEMP/proposal-issue.md"
          fi
