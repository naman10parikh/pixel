name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harness skeleton present
        run: |
          set -e
          for f in identity/SOUL.md brain HARNESS-OVERRIDES.md MASTER-TODOS.md IMPLEMENTATION-NOTES.md dsip.json; do
            [ -e "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "harness skeleton OK"
      - name: Secret scan (no real keys in tree)
        run: |
          set -e
          if grep -rInE 'sk-ant-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[bap]-' \
               --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo "::error::potential real secret committed"; exit 1
          fi
          echo "secret scan clean"

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect runtime
        id: rt
        run: |
          if [ -f package.json ]; then echo "armed=true" >> "$GITHUB_OUTPUT"; else echo "armed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.rt.outputs.armed == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.rt.outputs.armed == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install + build + test (red-blocking once code exists)
        if: steps.rt.outputs.armed == 'true'
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm exec playwright install --with-deps chromium  # repo's pinned playwright → matching browser build (npx fetches latest → revision mismatch)
          pnpm build
          pnpm test
      - name: Skeleton phase
        if: steps.rt.outputs.armed == 'false'
        run: echo "skeleton phase — build gate auto-arms when package.json lands (CP123 Wave B)"

  # ── THE ACCEPTANCE TEST (E19 / D9 bar / PLAN §5) — red-blocking, the #1 fleet-gap lesson. ──────
  # `pixel mock "<brief>"` (V0_API_KEY UNSET → keyless R2 scaffold path) → an ICP-aware mockup +
  # a scaffolded Next 16 app, then `impeccable detect` exits 0 (anti-slop, keyless) AND a Playwright
  # smoke boots the app and asserts a real bg-* computed background (S4) + 0 console hydration
  # warnings (S8). This proves pixel's moat is the GATE, not the generator (O7). No continue-on-error
  # → a failure reds the whole run. Needs npm + shadcn-registry egress + a Playwright browser.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install + build pixel
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - name: Install a Playwright browser (for the smoke half)
        run: pnpm exec playwright install --with-deps chromium  # repo-pinned playwright (npx-latest downloads a non-matching browser revision → smoke silently SKIPs)
      - name: Acceptance test — pixel mock → impeccable-clean + Playwright smoke (KEYLESS, red-blocking)
        env:
          # Intentionally NO V0_API_KEY → forces the keyless scaffold fallback (R2) the bar must prove.
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: node eval/acceptance.mjs --keep
      - name: Eval pyramid — GT1–GT15 golden tasks (red-blocking on a CI-block FAIL)
        run: node eval/eval.mjs
