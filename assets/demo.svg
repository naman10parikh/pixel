<text x="24" y="86" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:2.96s"># Discovery Brief</text>
<text x="24" y="106" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.00s"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.05s">&gt; Source brief: &quot;a booking page for a dental clinic&quot;</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.10s">&gt; Generated by `pixel design` (JOB 1). NO BRIEF = NO DESIGN (O11). The ICP is a specific named</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.15s">&gt; person, not a demographic. This brief is the HARD GATE before any pixel is placed — fill every</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.20s">&gt; section to a real answer (a blank section means discovery isn&#x27;t done). Section 1 (the ICP) is</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.25s">&gt; pre-filled from the brief; the rest are fill-prompts for real discovery.</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.30s"></text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.35s">## 1. The six sections (fill each — a blank is a failed gate)</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.40s">1. **ICP (a SPECIFIC named person — name, role, the tool they live in, the frustration)**</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.45s">   - **the user** (designing: booking page)</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.50s">   - frustration / context: _____ (fill from discovery — what makes today painful)</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.55s">2. **Primary Goal (the one job they hire this UI to do)**</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.60s">   - _____</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.65s">3. **Emotional Tone (the 3-second feeling test — what they should feel on first paint)**</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.70s">   - _____</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.75s">4. **Audience Problem (in THEIR words, not ours)**</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.80s">   - _____</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.85s">5. **Competitive Context (3 named competitors + what to steal / what to avoid)**</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.90s">   - _____</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:3.95s">6. **Success Metric (one KPI + a target number)**</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.00s">   - _____</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.05s"></text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.10s">## 2. Information-hierarchy map (Step 1.5 — also a gate, BEFORE any CSS)</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.15s">For each section of the page, rank attention:</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.20s">- **FIRST** — the one thing the eye lands on (carries ~60% of emotional weight; this is the DFS Hero).</text>
<text x="24" y="606" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.25s">- **SECOND** — supporting proof / the next read.</text>
