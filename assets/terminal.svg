<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">The Energy fleet's frontend employee — scaffolds, designs-to-taste,</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">generates-then-gates, and verifies Next.js 16 / Tailwind v4 / shadcn UI.</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">Generated UI is an untrusted draft until it passes the ship gate.</text>
<text x="24" y="186" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -v, --version                print the pixel version</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">  -h, --help                   display help for command</text>
<text x="24" y="266" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  mock [options] &lt;brief&gt;       flagship: discovery brief → first-pass draft →</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                               7-step gate → ICP-aware mockup + scaffolded Next</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                               app</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  scaffold [options] [dir]     clean Next 16 app via shadcn init -t next --base</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                               radix; wires Tailwind v4 @theme + house tokens</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  design [options] [brief]     discovery: 6-section brief + FIRST/SECOND/THIRD</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                               hierarchy map; refuses an empty brief</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  generate [options] &lt;prompt&gt;  v0 Platform API first-pass draft (untrusted —</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                               must pass `pixel audit`)</text>
