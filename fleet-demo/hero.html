<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayside Cardiology — Heart care that listens first</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100svh;display:flex;align-items:center;
    padding:clamp(2rem,6vw,7rem);
    font-family:"Poppins",ui-sans-serif,system-ui,sans-serif;
    color:#c9c4bd;
    background:
      radial-gradient(120% 90% at 12% 0%,rgba(224,162,78,.14),transparent 55%),
      #141312;
  }
  main{max-width:40rem}
  .pulse{color:oklch(0.78 0.15 65);display:block;margin-bottom:1.6rem}
  h1{
    font-family:"Instrument Serif",ui-serif,Georgia,serif;
    font-weight:400;color:#f5f1ea;
    font-size:clamp(2.7rem,7vw,4.4rem);line-height:1.02;
    letter-spacing:-.01em;margin-bottom:1.4rem;
  }
  p{font-size:clamp(1.05rem,2.2vw,1.2rem);line-height:1.65;max-width:34rem;margin-bottom:2.4rem}
  a.cta{
    display:inline-flex;align-items:center;gap:.5rem;
    background:oklch(0.78 0.15 65);color:#141312;
    font-weight:500;font-size:1rem;text-decoration:none;
    padding:.9rem 1.6rem;border-radius:.7rem;cursor:pointer;
    transition:transform .2s ease-out,background .2s ease-out;
  }
  a.cta:hover{background:oklch(0.83 0.15 65);transform:translateY(-2px)}
  a.cta:focus-visible{outline:2px solid oklch(0.78 0.15 65);outline-offset:3px}
</style>
</head>
<body>
  <main>
    <svg class="pulse" width="140" height="26" viewBox="0 0 140 26" fill="none" aria-hidden="true">
      <polyline points="0,13 44,13 54,3 64,23 74,13 140,13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Heart care that listens first.</h1>
    <p>Board-certified cardiologists in the Bay Area, pairing advanced diagnostics with unhurried, personal attention — so you leave every visit genuinely understood.</p>
    <a class="cta" href="#book">Book a consultation</a>
  </main>
</body>
</html>
